name: adpluga_flutter
description: Banner, native, interstitial, rewarded, video and carousel ads for Flutter apps, served by adPluga. No traffic minimum; a test key shows real ads with no charges.
version: 0.7.4
homepage: https://adpluga.com/en/devs/sdks/
repository: https://github.com/adpluga/adpluga-flutter
issue_tracker: https://github.com/adpluga/adpluga-flutter/issues
topics:
  - ads
  - advertising
  - monetization
  - banner
  - ad-network

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.11.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0
